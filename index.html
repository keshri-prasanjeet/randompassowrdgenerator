<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins|Roboto+Mono|Fira+Code' rel='stylesheet'>
    <title>Password Generator</title>
</head>
<body>
<div class="container">
    <h1 class="heading">Generate a <span class="headingspan">strong password</span></h1>
    <p class="about">Never use an insecure password again.</p>
    <div class="content">
        <h2 class="question"><span class="lengthdecor">How long</span> do you want the password?</h2>
        <div class="gen-input-wrapper">
            <input type="number" class="lenofpas" id="input-len" placeholder="Length"><br>
            <button class="generatebtn" id="generatebtn">Generate Passwords</button>
        </div>
        <hr class="line">
        <p id="messagetoclick">Click on a password to copy it</p>
        <div class="psw-wrapper">
            <div id="pass1" class="password-box" onclick="copyToClipboard('pass1')"></div>
            <div id="pass2" class="password-box" onclick="copyToClipboard('pass2')"></div>
        </div>
    </div>
</div>
<script src="index.js"></script>
</body>
</html>
